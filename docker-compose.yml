name: microservices

services:
  mysql-order:
    image: mysql:8.4
    container_name: mysql-order
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: order_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-order-data:/var/lib/mysql
      - ./sql/order_db.sql:/docker-entrypoint-initdb.d/order_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [microservices-net]

  mysql-nacos:
    image: mysql:8.4
    container_name: mysql-nacos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nacos_config
    ports:
      - "3307:3306"
    volumes:
      - mysql-nacos-data:/var/lib/mysql
      - ./nacos/mysql-schema.sql:/docker-entrypoint-initdb.d/mysql-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [microservices-net]

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql-nacos
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      # MySQL 8.4 默认 caching_sha2_password，需 allowPublicKeyRetrieval=true 才能非 SSL 连接
      # 注意：3.x 镜像用 MYSQL_SERVICE_DB_PARAM（2.x 是 MYSQL_SERVICE_PARAM），见镜像 conf/application.properties 的 db.url.0
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8848:8848"
      - "9848:9848"
      - "18080:8080" # 3.x 控制台在 8080（8848/nacos 只提示 console 端口）；宿主机用 18080 避免与 Task 5 gateway 的 8080 冲突
    depends_on:
      mysql-nacos:
        condition: service_healthy
    healthcheck:
      # 3.x 的 readiness 已迁移到 console 端口 8080 的 /v3/console/health/readiness（v1 路径返回 410 Gone）
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [microservices-net]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data   # 显式 named volume 持久化 RDB（down 后保留，down -v 才删；存 WSL2 虚机内非 /mnt/c）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [microservices-net]

  order-service:
    build: ./order-service
    image: microservices/order-service:latest
    container_name: order-service
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis 缓存（Task 12：Caffeine→Redis）。无缓存容量压测经 Nacos 热切换
      # order.cache.enabled=false。注意：此处不得注入 ORDER_CACHE_ENABLED 默认值——
      # OS 环境变量优先级高于 Nacos 配置，常驻 true 会把 Nacos 的热切换永远覆盖掉。
      # 兜底重建路径用 docker-compose.nocache.yml override 临时注入。
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8081:8081"
    depends_on:
      nacos:
        condition: service_healthy
      mysql-order:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [microservices-net]

  gateway:
    build: ./gateway
    image: microservices/gateway:latest
    container_name: gateway
    # scg.rate-limit 由 Nacos gateway.yaml 管理（application.yml 保留 ${SCG_RATE_LIMIT_RPS:40}
    # 占位符兜底）：改限流参数 = 改 Nacos + 重启，无需重建。容量态压测由 load-test.sh
    # b_phase_up 推 Nacos 放大（100000/200000），trap 恢复 40/40。
    environment:
      # 实验：Netty 事件循环线程数（Reactor Netty 无 Spring 配置项，走 JVM 系统属性；
      # 默认 availableProcessors=14）。H1/H2 拆分实验临时翻倍到 28，实验完改回 14 或删行
      JAVA_TOOL_OPTIONS: "-Dreactor.netty.ioWorkerCount=28"
    ports:
      - "8080:8080"
    # 兜底限流已本地化（Task 12），gateway 不再依赖 redis；nginx 的按 IP 限流镜像写仍用 redis
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [microservices-net]

  nginx:
    # OpenResty 边缘网关：监听 80 → 转发 gateway:8080；lua 按客户端 IP 令牌桶限流（10/s+20）
    # entrypoint 启动时用 envsubst '${BACKEND_HOST}' 渲染 nginx.conf.template
    # 到 /usr/local/openresty/nginx/conf/nginx.conf（挂 nginx.conf 会被覆盖，只能挂模板）
    image: seckill-gateway:local
    container_name: nginx
    environment:
      BACKEND_HOST: gateway
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # lua 限流阈值（lua/ratelimit.lua 读 os.getenv，默认 10/20）。
      # 用 shell 插值 ${VAR:-默认}：默认 10/20（Task 7 行为不变），容量态压测
      # 以 `RATE_LIMIT_RPS=1000 RATE_LIMIT_CAP=2000 docker compose up -d` 放大。
      # nginx.conf.template 已声明 env RATE_LIMIT_RPS / env RATE_LIMIT_CAP，
      # worker 里 os.getenv 才能读到（同 REDIS_HOST 机制）。
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_CAP: ${RATE_LIMIT_CAP:-20}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/lua:/etc/nginx/lua:ro
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # OpenResty alpine 是 ash 无 bash，不能用 /dev/tcp；镜像自带 busybox wget
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [microservices-net]

networks:
  microservices-net:
    driver: bridge

volumes:
  mysql-order-data:
  mysql-nacos-data:
  redis-data:
