server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: nacos:gateway.yaml
  cloud:
    nacos:
      server-addr: nacos:8848
      username: nacos
      password: nacos
    # SCG 4.3.0（Spring Cloud 2025.0.0）属性前缀已由 spring.cloud.gateway 迁移到
    # spring.cloud.gateway.server.webflux；旧前缀 routes 靠迁移器暂时重映射，
    # 但 default-filters 不在重映射列表中（会静默不绑定），必须直接使用新前缀
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=2      # /api/order/orders -> order-service 的 /orders（order-service 映射在 /orders，需剥掉 /api + /order）
          default-filters:
            - name: RequestRateLimiter
              args:
                # 全局兜底桶：正常负载（nginx 按 IP 限流 3×10/s=30/s）低于 40/s 兜底不误伤；
                # 绕过 nginx 直连 8080 的洪水仍被 40/s 封顶。
                # 注意：SCG 4.3.0 限流脚本 ttl=floor(capacity/rate*2)，rate>2×burst 时
                # ttl=0 不写 Redis、限流器静默失效，故放大时必须保持 rate ≤ 2×burst（实测验证）
                # 注意：SCG 4.3.0 的 RedisRateLimiter$Config.setBurstCapacity 断言
                # burstCapacity >= replenishRate（实测：40/20 绑定抛异常、静默回退构造默认 20/20），
                # 故 burst 最小只能等于 rate，默认 40/40（40/20 无法配置，Task 7 的"40/20"
                # 从未真正生效——其断言对 20/20 同样通过）。
                # 值来自环境变量占位符（compose 注入），默认 40/40；容量态压测经
                # SCG_RATE_LIMIT_RPS / SCG_RATE_LIMIT_BURST 放大（如 1000/2000）
                redis-rate-limiter.replenishRate: ${SCG_RATE_LIMIT_RPS:40}
                redis-rate-limiter.burstCapacity: ${SCG_RATE_LIMIT_BURST:40}
                key-resolver: "#{@globalKeyResolver}"
  data:
    redis:
      host: redis
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
