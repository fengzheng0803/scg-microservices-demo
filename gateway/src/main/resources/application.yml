server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: nacos:gateway.yaml
  cloud:
    nacos:
      server-addr: nacos:8848
      username: nacos
      password: nacos
    # SCG 4.3.0（Spring Cloud 2025.0.0）属性前缀已由 spring.cloud.gateway 迁移到
    # spring.cloud.gateway.server.webflux；旧前缀 routes 靠迁移器暂时重映射，
    # 但 default-filters 不在重映射列表中（会静默不绑定），必须直接使用新前缀
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=2      # /api/order/orders -> order-service 的 /orders（order-service 映射在 /orders，需剥掉 /api + /order）

# 全局兜底桶（Task 12 本地化：EdgeRateLimitBackstopFilter 本地内存令牌桶，不再查 Redis）：
#   - 带 X-Edge-RateLimited 头（nginx 边缘已按 IP 限流）→ 跳过；
#   - 直连 8080 的旁路流量 → LocalTokenBucket 本地判定（零网络往返，默认 40/40）。
# 本地桶无 RedisRateLimiter 的 burst>=rate 硬断言（40/20 等配置也合法）。
# 容量态压测经 SCG_RATE_LIMIT_RPS / SCG_RATE_LIMIT_BURST 放大（如 100000/200000）。
scg:
  rate-limit:
    replenish-rate: ${SCG_RATE_LIMIT_RPS:40}
    burst-capacity: ${SCG_RATE_LIMIT_BURST:40}

management:
  endpoints:
    web:
      exposure:
        include: health,info
